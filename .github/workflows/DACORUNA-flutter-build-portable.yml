name: DACORUNA - PORT- Build RustDesk Windows x64 (Sciter)

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-windows-diputacion.yml'
      - '**/*.rs'
      - 'Cargo.*'
      - 'libs/**'
      - 'src/**'

permissions:
  contents: read

env:
  # Valores por defecto (mejor usar GitHub Secrets para producción, ver abajo).
  DEFAULT_RENDEZVOUS_SERVER: soporteremoto-diputacion-pre.dacoruna.gal
  DEFAULT_RS_PUB_KEY: "mOmm0h89VKDmiGXdlpu/890jmPH4VYYvbbZTIovjSTk="
  DEFAULT_RELAY_SERVER: "soporteremoto-diputacion-pre.dacoruna.gal:21117"

jobs:
  build-windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout (submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Sciter EXIGE Rust 1.75 exacto. Versiones más nuevas (1.78+) cambiaron el
      # layout binario de i128 y rompen el "puente" Rust<->sciter.dll: compila
      # sin error, pero la ventana sale en blanco al arrancar.
      # https://github.com/rustdesk/rustdesk/discussions/7503
      - name: Setup Rust (1.75, requerido por Sciter)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.75"
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Flutter Windows desktop
        run: |
          flutter config --enable-windows-desktop
          flutter --version
          flutter doctor -v

      - name: Configure LLVM/Clang (for bindgen)
        run: |
          # windows-latest ya trae LLVM preinstalado; solo apuntamos LIBCLANG_PATH a él.
          # Si por lo que sea faltara, se instala sin fijar versión (evita el conflicto de downgrade).
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install -y llvm
          }
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Git & vcpkg dependencies
        run: |
          git --version
          git clone https://github.com/microsoft/vcpkg $env:USERPROFILE\vcpkg
          & $env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=$env:USERPROFILE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append
          # El repo de RustDesk trae su propio vcpkg.json (modo manifest) en la raíz.
          # IMPORTANTE: en modo manifest, "vcpkg install" instala por defecto en
          # <repo>\vcpkg_installed\<triplet>, pero el build.rs de magnum-opus (y otros
          # crates de Rust) buscan en $VCPKG_ROOT\installed\<triplet> (modo clásico).
          # Forzamos ese destino con --x-install-root para que coincidan.
          & $env:USERPROFILE\vcpkg\vcpkg.exe install --triplet x64-windows-static --x-install-root="$env:USERPROFILE\vcpkg\installed"

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache vcpkg installed
        uses: actions/cache@v4
        with:
          path: ${{ env.USERPROFILE }}\vcpkg\installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/workflows/**','vcpkg.json') }}

      - name: Download Sciter DLL (RustDesk Windows desktop)
        run: |
          New-Item -ItemType Directory -Force -Path target\release | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri https://raw.githubusercontent.com/c-smile/sciter-sdk/master/bin.win/x64/sciter.dll -OutFile target\release\sciter.dll
          # Copia también junto a Cargo.toml, la necesitamos ahí para incrustarla con include_bytes!
          Copy-Item target\release\sciter.dll .\sciter.dll -Force

      # Incrusta sciter.dll DENTRO del .exe (como bytes) y hace que se autoextraiga
      # junto a sí mismo la primera vez que arranca -> un único archivo portable,
      # sin tener que repartir el .dll por separado.
      - name: Embed sciter.dll into the binary (single-file portable)
        run: |
          $mainRs = "src\main.rs"
          $content = Get-Content $mainRs -Raw
          if ($content -notmatch 'RUSTDESK_EMBEDDED_SCITER_DLL') {
            $patchLines = @(
              '// --- RUSTDESK_EMBEDDED_SCITER_DLL: autoextrae sciter.dll junto al .exe ---',
              '{',
              '    let exe_dir = std::env::current_exe().unwrap().parent().unwrap().to_path_buf();',
              '    let dll_path = exe_dir.join("sciter.dll");',
              '    if !dll_path.exists() {',
              '        let bytes = std::include_bytes!("..\\sciter.dll");',
              '        let _ = std::fs::write(&dll_path, bytes.as_slice());',
              '    }',
              '}',
              '// --- fin RUSTDESK_EMBEDDED_SCITER_DLL ---',
              ''
            )
            $patch = [string]::Join([Environment]::NewLine, $patchLines)
            $content = $content -replace '(fn\s+main\s*\([^)]*\)\s*(->\s*[^\{]+)?\{\s*)', "`$1`n$patch`n"
            Set-Content -Path $mainRs -Value $content -Encoding UTF8 -NoNewline
            Write-Host "Patch aplicado en $mainRs"
          } else {
            Write-Host "Patch ya presente, se omite"
          }

      - name: Set ID/Key/Relay (from Secrets, con fallback a los valores por defecto)
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          RELAY_SERVER: ${{ secrets.RELAY_SERVER }}
        run: |
          if (-not $env:RENDEZVOUS_SERVER) { $env:RENDEZVOUS_SERVER = "$env:DEFAULT_RENDEZVOUS_SERVER" }
          if (-not $env:RS_PUB_KEY) { $env:RS_PUB_KEY = "$env:DEFAULT_RS_PUB_KEY" }
          if (-not $env:RELAY_SERVER) { $env:RELAY_SERVER = "$env:DEFAULT_RELAY_SERVER" }
          echo "Using RENDEZVOUS_SERVER=$env:RENDEZVOUS_SERVER"
          echo "Using RS_PUB_KEY=(hidden)"
          echo "Using RELAY_SERVER=$env:RELAY_SERVER"
          $candidateFiles = Get-ChildItem -Recurse -File -Path libs -Filter config.rs
          if ($candidateFiles.Count -eq 0) {
            Write-Error "config.rs not found: ¿cambió la estructura del repo?"; exit 1
          }
          foreach ($f in $candidateFiles) {
            (Get-Content $f.FullName) |
              ForEach-Object {
                $_ -replace '(?m)^(\s*pub\s+const\s+DEFAULT_RENDEZVOUS_SERVER\s*:\s*&str\s*=\s*)"[^"]*"', "`$1`"$env:RENDEZVOUS_SERVER`""
              } |
              ForEach-Object {
                $_ -replace '(?m)^(\s*pub\s+const\s+DEFAULT_RS_PUB_KEY\s*:\s*&str\s*=\s*)"[^"]*"', "`$1`"$env:RS_PUB_KEY`""
              } |
              ForEach-Object {
                $_ -replace '(?m)^(\s*pub\s+const\s+DEFAULT_RELAY_SERVER\s*:\s*&str\s*=\s*)"[^"]*"', "`$1`"$env:RELAY_SERVER`""
              } | Set-Content $f.FullName -Encoding UTF8
          }

      - name: Set up Python (para inline-sciter.py)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # CRÍTICO: sin este paso + el feature "inline", el binario no lleva
      # incrustados los recursos HTML/CSS de la interfaz de Sciter -> ventana
      # en blanco al arrancar, aunque compile perfectamente.
      - name: Inline Sciter UI resources
        run: |
          python res\inline-sciter.py

      - name: Build (release, x64)
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: |
          cargo build --locked --features inline --release --target x86_64-pc-windows-msvc --bins

      - name: Recopilar todas las DLLs necesarias
        run: |
          New-Item -ItemType Directory -Force -Path SignOutput | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\rustdesk.exe SignOutput\
          Copy-Item target\release\sciter.dll SignOutput\
          # Copia cualquier .dll que el propio cargo/vcpkg haya dejado junto al binario
          # (OpenSSL, etc.) — evita tener que copiarlas a mano después.
          Get-ChildItem target\x86_64-pc-windows-msvc\release\*.dll -ErrorAction SilentlyContinue |
            Copy-Item -Destination SignOutput\ -Force
          # Como refuerzo, copia también cualquier DLL runtime que vcpkg haya generado
          # (por si el triplet no dejó todo enlazado 100% estático).
          if (Test-Path "$env:USERPROFILE\vcpkg\installed\x64-windows-static\bin") {
            Get-ChildItem "$env:USERPROFILE\vcpkg\installed\x64-windows-static\bin\*.dll" -ErrorAction SilentlyContinue |
              Copy-Item -Destination SignOutput\ -Force
          }
          Write-Host "Contenido final del paquete:"
          Get-ChildItem SignOutput\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-diputacion-windows-x64
          path: SignOutput\

      - name: Show binary size
        run: |
          Get-ChildItem target\x86_64-pc-windows-msvc\release\rustdesk.exe | Select-Object Name,Length
