name: Build Flutter Windows Client

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix submodules URLs (HTTPS)
        run: |
          if (Test-Path .gitmodules) {
            (Get-Content .gitmodules) -replace 'git@github.com:', 'https://github.com/' | Set-Content .gitmodules
            git submodule sync
            git submodule update --init --recursive
          }

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM
        run: |
          choco install llvm -y

      # Fijamos la versión 3.10.6 de Flutter para evitar los errores de DialogTheme / google_fonts
      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          cache: true

      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1

      - name: Setup Custom vcpkg
        shell: cmd
        run: |
          mkdir "%TEMP%\vcpkg" 2>nul
          cd C:\
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          git checkout 2023.04.15
          call bootstrap-vcpkg.bat

      - name: Install vcpkg Dependencies
        shell: cmd
        run: |
          C:\vcpkg\vcpkg.exe install --triplet x64-windows-static

      - name: Generate Flutter-Rust Bindings
        run: |
          flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs --dart-output flutter/lib/generated_bridge.dart

      - name: Build Flutter Windows
        env:
          RENDEZVOUS_SERVER: ${{ vars.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
          VCPKG_ROOT: 'C:\vcpkg'
          VCPKG_DEFAULT_TRIPLET: 'x64-windows-static'
          BINDGEN_EXTRA_CLANG_ARGS: '-IC:\vcpkg\installed\x64-windows-static\include'
        run: |
          cd flutter
          flutter pub get
          flutter build windows --release

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-flutter-windows
          path: flutter/build/windows/runner/Release/
