name: Build Windows Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Fix and sync submodules (HTTPS)
        run: |
          if (Test-Path .gitmodules) {
            (Get-Content .gitmodules) -replace 'git@github.com:', 'https://github.com/' | Set-Content .gitmodules
            git submodule sync
            git submodule update --init --recursive
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM
        run: |
          choco install llvm -y

      - name: Set up vcpkg
        run: |
          vcpkg integrate install
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Build RustDesk Client
        env:
          RENDEZVOUS_SERVER: ${{ vars.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: |
          cargo build --release

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows
          path: target/release/rustdesk.exe
