name: Build Windows Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Fix and sync submodules (HTTPS)
        run: |
          if (Test-Path .gitmodules) {
            (Get-Content .gitmodules) -replace 'git@github.com:', 'https://github.com/' | Set-Content .gitmodules
            git submodule sync
            git submodule update --init --recursive
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM
        run: |
          choco install llvm -y

      - name: Setup vcpkg and Install Dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: 'C:/vcpkg'
          vcpkgGitCommitId: '2023.11.20'
          vcpkgJsonGlob: ''
          runVcpkgInstall: false

      - name: Install C++ Libraries
        run: |
          C:\vcpkg\vcpkg.exe install opus:x64-windows-static libvpx:x64-windows-static libyuv:x64-windows-static
          C:\vcpkg\vcpkg.exe integrate install
          
          # Copiar archivos de /opus/ a la raíz de include para compatibilidad con magnum-opus
          $incPath = "C:\vcpkg\installed\x64-windows-static\include"
          if (Test-Path "$incPath\opus") {
            Copy-Item -Path "$incPath\opus\*" -Destination $incPath -Recurse -Force
          }

      - name: Build RustDesk Client
        env:
          RENDEZVOUS_SERVER: ${{ vars.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
          VCPKG_ROOT: 'C:\vcpkg'
          VCPKG_DEFAULT_TRIPLET: 'x64-windows-static'
          INCLUDE: 'C:\vcpkg\installed\x64-windows-static\include'
          LIB: 'C:\vcpkg\installed\x64-windows-static\lib'
        run: |
          cargo build --release

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows
          path: target/release/rustdesk.exe
