name: Build Windows Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Fix and sync submodules (HTTPS)
        run: |
          if (Test-Path .gitmodules) {
            (Get-Content .gitmodules) -replace 'git@github.com:', 'https://github.com/' | Set-Content .gitmodules
            git submodule sync
            git submodule update --init --recursive
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM
        run: |
          choco install llvm -y

      - name: Install C++ Dependencies with Native vcpkg
        run: |
          $vcpkgDir = $env:VCPKG_INSTALLATION_ROOT
          echo "VCPKG_ROOT=$vcpkgDir" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV
          
          # Instalar librerías estáticas
          & "$vcpkgDir\vcpkg.exe" install opus:x64-windows-static libvpx:x64-windows-static libyuv:x64-windows-static
          & "$vcpkgDir\vcpkg.exe" integrate install

          # Corregir rutas de cabeceras para magnum-opus y C/C++
          $incPath = "$vcpkgDir\installed\x64-windows-static\include"
          if (Test-Path "$incPath\opus") {
            Copy-Item -Path "$incPath\opus\*" -Destination $incPath -Recurse -Force
          }

          # Exportar rutas de cabeceras y librerías al entorno global de GitHub Actions
          echo "INCLUDE=$incPath" >> $env:GITHUB_ENV
          echo "LIB=$vcpkgDir\installed\x64-windows-static\lib" >> $env:GITHUB_ENV
          echo "CPATH=$incPath" >> $env:GITHUB_ENV

      - name: Build RustDesk Client
        env:
          RENDEZVOUS_SERVER: ${{ vars.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: |
          cargo build --release

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows
          path: target/release/rustdesk.exe
