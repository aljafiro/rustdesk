name: Build Windows Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Fix and sync submodules (HTTPS)
        run: |
          if (Test-Path .gitmodules) {
            (Get-Content .gitmodules) -replace 'git@github.com:', 'https://github.com/' | Set-Content .gitmodules
            git submodule sync
            git submodule update --init --recursive
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM
        run: |
          choco install llvm -y

      - name: Install C++ Dependencies via vcpkg
        run: |
          $env:VCPKG_ROOT = "$env:VCPKG_INSTALLATION_ROOT"
          vcpkg install opus:x64-windows-static libvpx:x64-windows-static libyuv:x64-windows-static
          vcpkg integrate install
          
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV
          
          # Copiar cabeceras para solucionar la resolución de magnum-opus (opus/opus_multistream.h vs opus_multistream.h)
          $incPath = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\include"
          if (Test-Path "$incPath\opus") {
            Copy-Item -Path "$incPath\opus\*" -Destination $incPath -Recurse -Force
          }

      - name: Build RustDesk Client
        env:
          RENDEZVOUS_SERVER: ${{ vars.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
          VCPKG_ROOT: 'C:\vcpkg'
          INCLUDE: 'C:\vcpkg\installed\x64-windows-static\include'
          CPATH: 'C:\vcpkg\installed\x64-windows-static\include'
        run: |
          cargo build --release

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows
          path: target/release/rustdesk.exe
