name: Build RustDesk Portable Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout al repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar entorno de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          cache: true

      - name: Configurar Visual Studio y MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configurar Vcpkg e instalar dependencias
        shell: pwsh
        run: |
          vcpkg integrate install
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static --classic
          
          $vcpkgDir = "C:/vcpkg"
          if ($env:VCPKGROOT) { $vcpkgDir = $env:VCPKGROOT }
          echo "VCPKG_ROOT=$vcpkgDir" >> $env:GITHUB_ENV

      - name: Configurar variables de entorno del Servidor, Clave y Relay
        shell: pwsh
        run: |
          echo "RENDEZVOUS_SERVER=servidor-diputacion-pre.dacoruna.gal" >> $env:GITHUB_ENV
          echo "RS_PUB_KEY=mOmm0h89VKDmiGXdlpu/890jmPH4VYYvbbZTIovjSTk=" >> $env:GITHUB_ENV
          echo "FORCE_RELAY=Y" >> $env:GITHUB_ENV

      - name: Instalar dependencias de Flutter
        working-directory: flutter
        shell: pwsh
        run: |
          flutter pub get

      - name: Generar puentes FFI (Flutter Bridge)
        shell: pwsh
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          flutter_rust_bridge_codegen --rust-input .\src\flutter_ffi.rs --dart-output .\flutter\lib\generated_bridge.dart --c-output .\src\bridge_generated.h

      - name: Compilar versión Portable para Windows
        shell: pwsh
        run: |
          $env:CMAKE_GENERATOR = "Visual Studio 17 2022"
          python build.py --portable --flutter

      - name: Subir artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-portable-windows
          path: target/release/*.exe
