name: DACORUNA - Build RustDesk Portable Windows - CLI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de configuración (PRE o PRO)'
        required: true
        default: 'PRE'
        type: choice
        options:
          - PRE
          - PRO

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout al repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Reemplazar enlace simbólico por repositorio real
        shell: pwsh
        run: |
          if (Test-Path "libs/hbb_common") {
            Remove-Item -Force -Recurse "libs/hbb_common"
          }
          $token = "${{ secrets.GH_PAT }}"
          if (!$token) { $token = "${{ secrets.SUBMODULE_TOKEN }}" }
          if ($token) {
            git clone --depth 1 "https://$($token)@github.com/aljafiro/hbb_common.git" libs/hbb_common
          } else {
            git clone --depth 1 "https://github.com/aljafiro/hbb_common.git" libs/hbb_common
          }

      - name: Configurar entorno de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          cache: true

      - name: Instalar Visual Studio 2019 Build Tools para compatibilidad con Flutter
        shell: pwsh
        run: |
          choco install visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --quiet" --no-progress

      - name: Configurar Vcpkg e instalar dependencias
        shell: pwsh
        run: |
          vcpkg integrate install
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static --classic
          
          $vcpkgDir = "C:/vcpkg"
          if ($env:VCPKGROOT) { $vcpkgDir = $env:VCPKGROOT }
          echo "VCPKG_ROOT=$vcpkgDir" >> $env:GITHUB_ENV

      - name: Instalar dependencias de Flutter
        working-directory: flutter
        shell: pwsh
        run: |
          flutter pub get

      - name: Generar puentes FFI (Flutter Bridge)
        shell: pwsh
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          flutter_rust_bridge_codegen --rust-input .\src\flutter_ffi.rs --dart-output .\flutter\lib\generated_bridge.dart --c-output .\src\bridge_generated.h

      - name: Inyectar configuración del entorno en el código fuente de Rust
        shell: pwsh
        run: |
          $envName = "${{ inputs.environment }}"
          if (!$envName) { $envName = "PRE" }
          python configure_env.py apply $envName

      - name: Compilar versión Portable limpia
        shell: pwsh
        run: |
          python build.py --portable --flutter --incoming-only

      - name: Subir artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-portable-windows
          path: |
            target/release/*.exe
            flutter/build/windows/runner/Release/*.exe
            *.exe

      - name: Crear configuración portable por defecto
        shell: pwsh
        run: |
          $releaseDir = "flutter/build/windows/x64/runner/Release"
          if (!(Test-Path $releaseDir)) {
            $releaseDir = "target/release"
          }
          $envName = "${{ inputs.environment }}"
          if (!$envName) { $envName = "PRE" }
          python configure_env.py generate-toml $envName --output "$releaseDir" --incoming-only

      - name: Subir carpeta portable limpia como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-true-portable-windows-CLI
          path: flutter/build/windows/x64/runner/Release/

      - name: Empaquetar ejecutable único portable oficial de RustDesk
        shell: pwsh
        run: |
          $envName = "${{ inputs.environment }}"
          if (!$envName) { $envName = "PRE" }
          $finalExe = if ($envName -eq "PRE") { "soporte-diputacion-pre.exe" } else { "soporte-diputacion.exe" }
          python package_official_portable.py "flutter/build/windows/x64/runner/Release" $finalExe
          echo "FINAL_EXE=$finalExe" >> $env:GITHUB_ENV

      - name: Subir ejecutable único portable oficial
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_EXE }}
          path: ${{ env.FINAL_EXE }}
